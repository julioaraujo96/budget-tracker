services:
  backend:
    build: ./backend
    ports:
      - "3001:3001"
    volumes:
      - budget-data:/app/data
    environment:
      - PORT=3001
      - DATABASE_PATH=/app/data/budget.db
      - CORS_ORIGIN=http://localhost:5173
      - NODE_ENV=production
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  budget-data:
